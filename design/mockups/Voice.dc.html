<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Harmony — salon vocal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-height: 100vh; background: #111214">
  <dc-import name="Main" start-channel="salon-vocal" accent="{{accent}}" hint-size="100%,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#7CD4A8","options":["#7CD4A8","#8AB4F8","#F2B880","#C9A7F5"]},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#7CD4A8' };
  }
}
</script>
</body>
</html>
